<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TradeSetup AI - Pro Screener & Verifier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(22, 27, 34, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-glow: rgba(56, 189, 248, 0.03);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --green: #10b981;
      --green-bg: rgba(16, 185, 129, 0.12);
      --red: #f43f5e;
      --red-bg: rgba(244, 63, 94, 0.12);
      --yellow: #f59e0b;
      --yellow-bg: rgba(245, 158, 11, 0.12);
      --text: #94a3b8;
      --text-bright: #f8fafc;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px 16px; min-height: 100vh; background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.08) 0%, transparent 50%); }
    .mono { font-family: 'JetBrains Mono', monospace; }

    .app-container { max-width: 1140px; margin: 0 auto; }

    /* Header */
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--card-border); flex-wrap: wrap; gap: 12px; }
    .logo-area { display: flex; align-items: center; gap: 12px; }
    .logo-badge { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, #38bdf8, #6366f1); display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 1.1rem; box-shadow: 0 4px 14px rgba(56, 189, 248, 0.4); }
    .logo-title { font-size: 1.25rem; font-weight: 700; color: var(--text-bright); }
    .logo-sub { font-size: 0.75rem; color: var(--text-muted); }

    .preset-pills { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-pill { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-bright); padding: 6px 14px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; }
    .btn-pill:hover { background: rgba(255, 255, 255, 0.1); border-color: var(--accent); color: var(--accent); }

    /* Layout */
    .dashboard-grid { display: grid; grid-template-columns: 420px 1fr; gap: 20px; }
    @media (max-width: 960px) { .dashboard-grid { grid-template-columns: 1fr; } }

    /* Card Panels */
    .panel { background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: 16px; padding: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3); }
    .panel-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .panel-title { font-size: 0.95rem; font-weight: 700; color: var(--text-bright); text-transform: uppercase; letter-spacing: 0.05em; display: flex; align-items: center; gap: 8px; }
    .panel-title::before { content: ""; width: 3px; height: 14px; background: var(--accent); border-radius: 2px; }

    /* Inputs */
    .input-section-title { font-size: 0.72rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.08em; margin: 14px 0 8px 0; }
    .form-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
    .form-row label { font-size: 0.82rem; color: var(--text); }
    .form-row input, .form-row select { background: #0d121d; border: 1px solid var(--card-border); color: var(--text-bright); padding: 7px 10px; border-radius: 8px; width: 130px; font-size: 0.85rem; font-weight: 500; text-align: right; transition: all 0.2s; }
    .form-row select { text-align: left; }
    .form-row input:focus, .form-row select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }

    .btn-calc { width: 100%; margin-top: 18px; padding: 12px; background: linear-gradient(135deg, #38bdf8, #2563eb); border: none; border-radius: 10px; color: #fff; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: transform 0.1s, box-shadow 0.2s; box-shadow: 0 4px 16px rgba(56, 189, 248, 0.3); }
    .btn-calc:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(56, 189, 248, 0.4); }

    /* Top Result Verdict Hero */
    .hero-verdict { border-radius: 14px; padding: 20px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border: 1px solid transparent; transition: all 0.3s ease; }
    .verdict-info h2 { font-size: 1.45rem; font-weight: 800; line-height: 1.2; }
    .verdict-info p { font-size: 0.82rem; margin-top: 4px; opacity: 0.9; }

    .verdict-buy { background: var(--green-bg); border-color: rgba(16, 185, 129, 0.3); color: var(--green); }
    .verdict-watch { background: var(--yellow-bg); border-color: rgba(245, 158, 11, 0.3); color: var(--yellow); }
    .verdict-avoid { background: var(--red-bg); border-color: rgba(244, 63, 94, 0.3); color: var(--red); }

    /* Score Dial */
    .dial-wrapper { position: relative; width: 68px; height: 68px; display: flex; align-items: center; justify-content: center; }
    .dial-svg { transform: rotate(-90deg); width: 68px; height: 68px; }
    .dial-svg circle { fill: none; stroke-width: 6; stroke-linecap: round; }
    .dial-bg { stroke: rgba(255, 255, 255, 0.08); }
    .dial-fill { stroke: currentColor; stroke-dasharray: 188; stroke-dashoffset: 60; transition: stroke-dashoffset 0.8s ease; }
    .dial-text { position: absolute; font-size: 0.95rem; font-weight: 800; }

    /* 4 Gates Horizontal Grid */
    .gates-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
    @media (max-width: 600px) { .gates-row { grid-template-columns: 1fr 1fr; } }
    .gate-card { background: rgba(13, 18, 29, 0.6); border: 1px solid var(--card-border); border-radius: 12px; padding: 12px 10px; text-align: center; }
    .gate-lbl { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
